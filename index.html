<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avi Bhawnani</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23f97316'/></svg>" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Avi Bhawnani's Portfolio" />
  <meta property="og:description" content="Avi is a backend engineer based out of India." />
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://avibhawnani.github.io" />
  <meta property="og:image"       content="https://avibhawnani.github.io/content/og-image.png" />

  <!-- Twitter / X card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Avi Bhawnani's Portfolio" />
  <meta name="twitter:description" content="Avi is a backend engineer based out of India." />
  <meta name="twitter:image"       content="https://avibhawnani.github.io/content/og-image.png" />

  <!-- Stylesheets — edit each file independently -->
  <link rel="stylesheet" href="css/theme.css"  />
  <link rel="stylesheet" href="css/base.css"   />
  <link rel="stylesheet" href="css/nav.css"    />
  <link rel="stylesheet" href="css/hero.css"   />
  <link rel="stylesheet" href="css/tabs.css"   />
  <link rel="stylesheet" href="css/footer.css" />
</head>
<body>

<div id="scroll-progress"></div>

<div class="container">

  <!-- ======== NAV ======== -->
  <nav>
    <div class="nav-left">
      <div class="nav-dot"></div>
      <a id="nav-email" href="#" class="nav-email">Write to me via email</a>
    </div>
    <div class="nav-right">
      <a id="nav-twitter"  href="#" target="_blank" class="nav-link">LeetCode</a>
      <a id="nav-github"   href="#" target="_blank" class="nav-link">GitHub</a>
      <a id="nav-linkedin" href="#" target="_blank" class="nav-link">LinkedIn</a>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <!-- Sun — shown in dark mode -->
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="4"/>
          <path stroke-linecap="round" d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <!-- Moon — shown in light mode -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="display:none">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Status bar — below nav, mail icon LHS + status RHS -->
  <div class="status-bar">
    <button id="nav-email-icon" class="nav-email-icon" aria-label="Copy email">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </button>
    <div id="hero-status" class="hero-status"></div>
  </div>

  <!-- ======== HERO ======== -->
  <section class="hero anim-1">
    <h1 id="hero-headline"></h1>
  </section>

  <!-- ======== RECENT WORK ======== -->
  <section class="section anim-2">
    <p class="section-label">Recent Work Experience</p>
    <p id="work-blurb" class="section-body"></p>
    <div id="stats-row" class="stats-row"></div>
  </section>

  <!-- ======== TABS ======== -->
  <div class="tabs-wrap anim-3">

    <div class="tabs">
      <button class="tab-btn active" id="tab-skills"     data-target="skills"     data-label="Skills">Skills</button>
      <button class="tab-btn"        id="tab-experience" data-target="experience" data-label="Work">Work</button>
      <button class="tab-btn"        id="tab-projects"   data-target="projects"   data-label="Projects">Projects</button>
      <button class="tab-btn"        id="tab-education"  data-target="education"  data-label="Education">Education</button>
      <button class="tab-btn"        id="tab-writings"   data-target="writings"   data-label="Writings">Writings</button>
    </div>

    <!-- Panels — content injected by render.js -->
    <div id="panel-skills"     class="tab-panel active"></div>
    <div id="panel-experience" class="tab-panel"></div>
    <div id="panel-projects"   class="tab-panel"></div>
    <div id="panel-education"  class="tab-panel"></div>
    <div id="panel-writings"   class="tab-panel"></div>

  </div>

  <!-- ======== FOOTER ======== -->
  <footer>
    <span id="footer-tagline" class="footer-left"></span>
    <span id="footer-clock" class="footer-right"></span>
  </footer>

</div><!-- /container -->

<!-- Scripts — load order matters: data first, then render, then behaviours -->
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/theme.js"></script>
<script src="js/tabs.js"></script>
<script src="js/scroll.js"></script>

</body>
</html>
